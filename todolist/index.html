
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo · Intuitive Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="todo-card">

  <div class="header">
    <h1>
      <i class="fas fa-check-double"></i> 
      Todo·Pro
    </h1>
    <div class="header-actions">
      <button class="btn-icon" id="exportBtn"><i class="fas fa-print"></i> Export</button>
      <button class="btn-icon" id="viewBtn"><i class="fas fa-sliders-h"></i> Vue</button>
    </div>
  </div>

  <div class="search-bar">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Rechercher une tâche...">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all"><i class="fas fa-list-ul"></i> Toutes</button>
      <button class="filter-btn" data-filter="active"><i class="fas fa-circle"></i> Actives</button>
      <button class="filter-btn" data-filter="completed"><i class="fas fa-check-circle"></i> Terminées</button>
    </div>
  </div>

  <div class="todo-list"></div>

  <div class="add-section">
    <div class="input-wrapper">
      <input type="text" id="taskInput" placeholder="Ajouter une nouvelle tâche...">
    </div>
    <div class="select-wrapper">
      <select id="prioritySelect">
        <option value="normal">🟢 Normal</option>
        <option value="urgent">🔴 Urgent</option>
      </select>
      <select id="categorySelect">
        <option value="work">💼 Travail</option>
        <option value="personal">🧑 Personnel</option>
        <option value="other">📌 Autre</option>
      </select>
    </div>
    <button class="add-btn" id="addBtn"><i class="fas fa-plus"></i> Ajouter</button>
  </div>

  <div class="stats">
    <span class="count" id="statsCount"><i class="far fa-clock"></i> 0 actives · 0 terminées</span>
    <button class="clear-btn" id="clearBtn"><i class="far fa-trash-alt"></i> Supprimer terminées</button>
  </div>

</div>
</body>
<script src="script.js"></script>
</html>
